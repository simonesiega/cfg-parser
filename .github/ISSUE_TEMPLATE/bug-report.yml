name: Bug report
description: Report a reproducible problem with CFG Parser
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CFG Parser. Search existing issues and review the [troubleshooting guide](https://github.com/simonesiega/cfg-parser/blob/master/docs/guides/troubleshooting.md) first.

        Do not report vulnerabilities here. Use the private process in the [security policy](https://github.com/simonesiega/cfg-parser/blob/master/SECURITY.md#reporting-a-vulnerability).

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced the problem on the latest `master` branch when possible.
          required: true
        - label: This report does not contain secrets or unrelated personal data.
          required: true

  - type: textarea
    id: expression
    attributes:
      label: Expression
      description: Provide the smallest expression that demonstrates the problem and say whether it was passed as an argument or through `CFGPARSER_INPUT`.
      placeholder: |
        Expression: 2 + 3 =
        Input source: command-line argument
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the exact relevant output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal, reliable sequence.
      placeholder: |
        1. Clone the repository.
        2. Run `cargo run --release -- "..."`.
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Rust/Cargo versions, and whether you used Cargo, an installed binary, or Docker.
      placeholder: |
        OS: Ubuntu 24.04
        rustc: 1.xx.x
        cargo: 1.xx.x
        Invocation: Cargo / installed binary / Docker
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or related details if they help explain the problem.
